<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>buda allamm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#0f2226;--card:#173238;--ink:#e6f2f1;--mute:#93b3b6;--line:#274a50;--acc:#4cc2cf;--accInk:#08262b;--warn:#f2b705;--danger:#ff7a6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2226;--card:#173238;--ink:#e6f2f1;--mute:#93b3b6;--line:#274a50;--acc:#4cc2cf;--accInk:#08262b;--danger:#ff7a6b}}
:root[data-theme="dark"]{--bg:#0f2226;--card:#173238;--ink:#e6f2f1;--mute:#93b3b6;--line:#274a50;--acc:#4cc2cf;--accInk:#08262b;--danger:#ff7a6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:17px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;font-weight:800;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-weight:500;margin:0 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
textarea{resize:vertical;min-height:72px}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
button{font:inherit;font-weight:500;cursor:pointer;border:0;border-radius:10px;padding:10px 16px}
.main{background:var(--acc);color:var(--accInk);width:100%;font-size:18px;font-weight:800}
.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:14px 0;color:var(--mute);font-size:15px}
.bar button{padding:6px 12px;font-size:14px}
#status{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:15px;color:var(--mute);margin-bottom:16px}
h2{font-size:19px;margin:24px 0 8px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--acc);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
li.late{border-inline-start-color:var(--danger)}
li.done{opacity:.55;border-inline-start-color:var(--line)}
li .t{font-weight:800;font-size:15px;color:var(--acc)}
li.late .t{color:var(--danger)}
li p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
li button{padding:6px 10px;font-size:14px}
.empty{color:var(--mute);text-align:center;padding:18px}
#ring{position:fixed;inset:0;background:rgba(10,25,28,.82);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#ring.on{display:flex}
#ring .box{max-width:420px;width:100%;text-align:center;border:3px solid var(--warn)}
#ring h3{margin:0 0 6px;font-size:24px}
#ring p{font-size:20px;margin:6px 0 16px;white-space:pre-wrap;word-break:break-word}
#ring .row{display:flex;gap:10px}
#ring .row button{flex:1}
@media (prefers-reduced-motion:no-preference){#ring.on .box{animation:p 1s ease-in-out infinite alternate}@keyframes p{to{transform:scale(1.03)}}}
</style>
</head>
<body>
<main>
  <h1>buda allamm</h1>
  <p class="sub">اكتب ملحوظة، حدد الوقت، وهيجيلك تنبيه في ميعاده.</p>

  <div class="box">
    <label for="note">الملحوظة</label>
    <textarea id="note" placeholder="مثلًا: كلّم المورّد بخصوص الشحنة"></textarea>
    <label for="when">الوقت والتاريخ</label>
    <input id="when" type="datetime-local">
    <button class="main" id="add">أضف التنبيه</button>
  </div>

  <div class="bar"><span id="perm"></span><button class="ghost" id="ask">فعّل إشعارات المتصفح</button></div>
  <div id="status">سيب الصفحة مفتوحة (حتى في تبويب تاني) علشان التنبيه يشتغل في ميعاده.</div>

  <h2>القادمة</h2><ul id="up"></ul>
  <h2>انتهت</h2><ul id="past"></ul>
</main>

<div id="ring" role="alertdialog" aria-live="assertive">
  <div class="box">
    <h3>⏰ تنبيه</h3>
    <p id="ringText"></p>
    <div class="row">
      <button class="main" id="ok">تم</button>
      <button class="ghost" id="snz">بعد 5 دقايق</button>
    </div>
  </div>
</div>

<script>
(function(){
var KEY='reminders-v1', items=[], queue=[], ringing=null, beepTimer=null, ctx=null;
var $=function(i){return document.getElementById(i)};

function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function pad(n){return n<10?'0'+n:''+n}
function toLocalInput(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function fmt(ts){return new Date(ts).toLocaleString('ar-EG',{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'})}
function defaultWhen(){var d=new Date(Date.now()+10*60000);d.setSeconds(0,0);$('when').value=toLocalInput(d)}

function render(){
  var now=Date.now(),up=[],past=[];
  items.slice().sort(function(a,b){return a.at-b.at}).forEach(function(r){(r.done?past:up).push(r)});
  function row(r){
    var late=!r.done&&r.at<now;
    var li=document.createElement('li');
    li.className=(r.done?'done ':'')+(late?'late':'');
    var d=document.createElement('div');
    var t=document.createElement('div');t.className='t';t.textContent=fmt(r.at);
    var p=document.createElement('p');p.textContent=r.text;
    d.appendChild(t);d.appendChild(p);
    var b=document.createElement('button');b.className='ghost';b.textContent='احذف';
    b.onclick=function(){nCancel(r);items=items.filter(function(x){return x.id!==r.id});save();render()};
    li.appendChild(d);li.appendChild(b);return li;
  }
  function fill(el,list,msg){el.innerHTML='';if(!list.length){var e=document.createElement('li');e.className='empty';e.style.display='block';e.style.borderInlineStart='1px solid var(--line)';e.textContent=msg;el.appendChild(e)}list.forEach(function(r){el.appendChild(row(r))})}
  fill($('up'),up,'مفيش تنبيهات قادمة. أضف أول واحد من فوق.');
  fill($('past'),past,'لسه مفيش حاجة انتهت.');
}

function permLabel(){
  var p=('Notification' in window)?Notification.permission:'unsupported';
  $('perm').textContent=p==='granted'?'إشعارات المتصفح: مفعّلة':p==='denied'?'إشعارات المتصفح: ممنوعة (فعّلها من إعدادات الموقع)':p==='unsupported'?'المتصفح ده مش بيدعم الإشعارات':'إشعارات المتصفح: مش مفعّلة';
  $('ask').style.display=p==='default'?'':'none';
}

function beep(){
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    [0,.25,.5].forEach(function(o){
      var osc=ctx.createOscillator(),g=ctx.createGain();
      osc.frequency.value=880;g.gain.value=.25;
      osc.connect(g);g.connect(ctx.destination);
      osc.start(ctx.currentTime+o);osc.stop(ctx.currentTime+o+.15);
    });
  }catch(e){}
}

var origTitle=document.title;
function showNext(){
  if(ringing||!queue.length)return;
  ringing=queue.shift();
  $('ringText').textContent=ringing.text;
  $('ring').classList.add('on');
  document.title='⏰ '+ringing.text;
  beep();clearInterval(beepTimer);beepTimer=setInterval(beep,4000);
  try{if('Notification' in window&&Notification.permission==='granted'){
    var n=new Notification('⏰ تنبيه',{body:ringing.text,requireInteraction:true,tag:'rem-'+ringing.id});
    n.onclick=function(){window.focus();n.close()};
  }}catch(e){}
  if(navigator.vibrate)navigator.vibrate([300,150,300]);
}
function closeRing(){
  clearInterval(beepTimer);$('ring').classList.remove('on');document.title=origTitle;ringing=null;showNext();
}
$('ok').onclick=function(){if(ringing){ringing.done=true;nCancel(ringing);save()}closeRing();render()};
$('snz').onclick=function(){if(ringing){ringing.at=Date.now()+5*60000;ringing.done=false;ringing.fired=false;nSched(ringing);save()}closeRing();render()};

function tick(){
  var now=Date.now(),changed=false;
  items.forEach(function(r){
    if(!r.done&&!r.fired&&r.at<=now){r.fired=true;queue.push(r);changed=true}
  });
  if(changed){save();render();showNext()}
}

$('add').onclick=function(){
  var text=$('note').value.trim(),v=$('when').value;
  if(!text){$('note').focus();return}
  var at=new Date(v).getTime();
  if(!v||isNaN(at)){$('when').focus();return}
  var it={id:Date.now()+''+Math.random().toString(36).slice(2,6),nid:Math.floor(Math.random()*2000000000)+1,text:text,at:at,done:false,fired:false};items.push(it);nSched(it);
  save();$('note').value='';defaultWhen();render();
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if('Notification' in window&&Notification.permission==='default')permAsk();
};
function permAsk(){try{Notification.requestPermission().then(permLabel)}catch(e){try{Notification.requestPermission(permLabel)}catch(_){}}}
$('ask').onclick=permAsk;

var NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function LN(){return NATIVE&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications}
function nSched(r){var p=LN();if(!p||!r.nid||r.at<=Date.now())return;p.schedule({notifications:[{id:r.nid,title:'\u23f0 تنبيه',body:r.text,channelId:'rem',schedule:{at:new Date(r.at),allowWhileIdle:true}}]}).catch(function(){})}
function nCancel(r){var p=LN();if(p&&r.nid)p.cancel({notifications:[{id:r.nid}]}).catch(function(){})}
function nInit(){var p=LN();if(!p)return;
$('status').textContent='التنبيهات بتوصلك حتى لو التطبيق مقفول.';$('perm').textContent='';$('ask').style.display='none';
p.createChannel({id:'rem',name:'التنبيهات',importance:5,visibility:1,vibration:true}).catch(function(){});
p.requestPermissions().then(function(){return p.checkExactNotificationSetting&&p.checkExactNotificationSetting()}).then(function(x){if(x&&x.exact_alarm!=='granted'&&p.changeExactNotificationSetting)return p.changeExactNotificationSetting()}).catch(function(){});
items.forEach(function(r){if(!r.done)nSched(r)})}
load();defaultWhen();permLabel();render();tick();nInit();
setInterval(tick,1000);
document.addEventListener('visibilitychange',tick);
})();
</script>
</body>
</html>
